[project]
name = "agrolens"
version = "1.0.0"
description = "Monitoreo agrícola satelital y agroclimático"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.40",
    "streamlit-folium>=0.21",
    "folium>=0.16",
    "branca>=0.7",
    "Authlib>=1.3.2",
    "httpx>=0.27",
    "pandas>=2.0,<3",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "requests>=2.31",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.5",
    "rasterio>=1.3",
    "earthengine-api>=0.1.390",
    "plotly>=5.20",
    "matplotlib>=3.7",
    "reportlab>=4.0",
    "xlsxwriter>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["agrolens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 105
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"views/*" = ["E402"]
"app.py" = ["E402"]
